<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>서연아 놀러 가자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff7aa8; --pink-d:#e8558a; --sky:#bfe8ff; --grass:#c8ef9a; --cream:#fff8ec;
  --ink:#4a3a3a; --yellow:#ffd34d; --mint:#7fdcc0;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
.screen.on{display:flex}

/* ---------- HOME ---------- */
#home{align-items:center;justify-content:center;gap:2.5vh;
  background:radial-gradient(circle at 50% 120%,var(--grass) 0 38%,transparent 38.2%),linear-gradient(#bfe8ff,#e8f7ff)}
.cloud{position:absolute;font-size:9vmin;opacity:.9;animation:drift 18s linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
#home h1{margin:0;font-weight:400;font-size:clamp(40px,9vmin,96px);color:var(--pink-d);
  text-shadow:0 4px 0 #fff,0 8px 0 rgba(0,0,0,.08);letter-spacing:2px;text-align:center}
.portrait{width:min(42vmin,340px);aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center;
  border:10px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.08),0 0 0 10px var(--pink);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}
.big-btn{font-size:clamp(28px,5.5vmin,52px);padding:.45em 1.6em;border-radius:999px;background:var(--pink);color:#fff;
  box-shadow:0 8px 0 var(--pink-d);transition:transform .1s}
.big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--pink-d)}
.corner{position:absolute;top:calc(12px + var(--safe-t));display:flex;gap:10px}
.corner.r{right:12px}.corner.l{left:12px}
.icon-btn{width:58px;height:58px;border-radius:18px;background:#fff;font-size:28px;box-shadow:0 4px 0 rgba(0,0,0,.12);display:grid;place-items:center;position:relative;overflow:hidden}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.icon-btn.off{opacity:.45}
.hold-fill{position:absolute;left:0;bottom:0;height:0;width:100%;background:rgba(255,122,168,.45);pointer-events:none}
.hold-tip{position:absolute;top:calc(78px + var(--safe-t));right:14px;background:#fff;padding:6px 12px;border-radius:12px;font-size:16px;opacity:0;transition:.3s;pointer-events:none}
.hold-tip.show{opacity:1}

/* ---------- CHOOSE ---------- */
#choose{background:linear-gradient(#e8f7ff,#fff8ec)}
.choose-head{display:flex;align-items:center;gap:18px;padding:16px 20px 6px 90px;min-height:110px}
.mini-face{width:96px;height:96px;flex:none;border-radius:50%;background-size:cover;background-position:center;border:5px solid #fff;box-shadow:0 0 0 5px var(--pink)}
.bubble{position:relative;background:#fff;border-radius:28px;padding:14px 26px;font-size:clamp(28px,5vmin,46px);box-shadow:0 5px 0 rgba(0,0,0,.08);cursor:pointer}
.bubble:before{content:"";position:absolute;left:-16px;top:50%;margin-top:-12px;border:12px solid transparent;border-right:18px solid #fff;border-left:0}
.bubble.talk{animation:talk .5s ease-in-out 3}
@keyframes talk{50%{transform:scale(1.06)}}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(clamp(150px,22vw,230px),1fr));gap:clamp(14px,2.4vw,26px);padding:14px clamp(14px,3vw,34px) 40px;align-content:start}
.card{position:relative;background:#fff;border-radius:28px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  box-shadow:0 7px 0 rgba(0,0,0,.09);transition:transform .12s;touch-action:manipulation}
.card:active{transform:scale(.95)}
.card.pick{animation:pick .5s ease}
@keyframes pick{30%{transform:scale(1.12) rotate(-3deg)}60%{transform:scale(.96)}100%{transform:scale(1)}}
.thumb{width:100%;aspect-ratio:1;border-radius:20px;display:grid;place-items:center;font-size:clamp(64px,10vw,110px);position:relative;background-size:cover;background-position:center}
.thumb .badge{position:absolute;right:-6px;bottom:-6px;width:46%;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;
  font-size:clamp(30px,4.6vw,52px);box-shadow:0 3px 8px rgba(0,0,0,.18)}
.card .name{font-size:clamp(22px,3.4vw,34px)}

/* ---------- PLAY ---------- */
#play{background:#c8ef9a}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.topbar{position:absolute;left:0;right:0;top:calc(10px + var(--safe-t));display:flex;justify-content:space-between;align-items:center;padding:0 12px;pointer-events:none;z-index:2}
.topbar>*{pointer-events:auto}
.seg{display:flex;background:#fff;border-radius:18px;padding:5px;gap:4px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.seg button{padding:10px 14px;border-radius:13px;background:transparent;font-size:18px}
.seg button.sel{background:var(--pink);color:#fff}
.title-tag{background:#fff;border-radius:18px;padding:8px 18px;font-size:clamp(20px,3.4vmin,30px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.grp{display:flex;gap:10px;align-items:center}

/* ---------- WIN ---------- */
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,248,236,.55);z-index:20;backdrop-filter:blur(2px)}
#win.on{display:flex}
.win-box{background:#fff;border-radius:40px;padding:26px 34px 30px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 12px 0 rgba(0,0,0,.1);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.win-pics{display:flex;align-items:center;gap:16px}
.win-pics .mini-face{width:min(26vmin,170px);height:min(26vmin,170px)}
.win-dest{width:min(30vmin,200px);aspect-ratio:1;border-radius:30px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:min(18vmin,120px);position:relative;background-color:#fff4d6}
.win-dest .badge{position:absolute;right:-10px;bottom:-10px;width:44%;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:min(8vmin,54px);box-shadow:0 3px 8px rgba(0,0,0,.2)}
.win-title{font-size:clamp(36px,7vmin,70px);color:var(--pink-d)}
.win-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.win-btns button{font-size:clamp(20px,3.4vmin,30px);padding:.5em 1.1em;border-radius:999px;background:var(--mint);box-shadow:0 6px 0 #4fb698}
.win-btns button.main{background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pink-d)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:21}

/* ---------- SETTINGS ---------- */
#settings{position:fixed;inset:0;z-index:30;padding-top:var(--safe-t);background:var(--cream);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
#settings.on{display:block}
.set-wrap{max-width:860px;margin:0 auto;padding:20px 18px 80px}
.set-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--cream);padding:10px 0;z-index:3}
.set-head h2{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:30px}
.done-btn{font-family:'Jua',sans-serif;font-size:22px;background:var(--pink);color:#fff;padding:10px 24px;border-radius:999px;box-shadow:0 5px 0 var(--pink-d)}
.sec{background:#fff;border-radius:22px;padding:18px;margin:16px 0;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.sec h3{margin:0 0 4px;font-family:'Jua',sans-serif;font-weight:400;font-size:24px}
.sec p.help{margin:0 0 12px;color:#8a7a7a;font-size:15px;line-height:1.5}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px dashed #eadfd2;flex-wrap:wrap}
.row:first-of-type{border-top:none}
.row .lbl{flex:1;min-width:190px;font-size:17px}
.row .lbl small{display:block;color:#a08f8f;font-size:13px;margin-top:2px}
.sbtn{font-size:16px;padding:10px 14px;border-radius:14px;background:#f2ebe3;min-width:48px}
.sbtn.rec{background:#ffe1ea;color:#d33a6c}
.sbtn.rec.live{background:#e8335f;color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
.sbtn.add{background:var(--mint);color:#fff;font-family:'Jua',sans-serif;font-size:20px;padding:12px 20px}
.state{font-size:13px;padding:4px 10px;border-radius:999px;background:#eef6ff;color:#4a7ab0}
.state.ok{background:#e4f8ee;color:#2e9a63}
.pthumb{width:64px;height:64px;border-radius:16px;background:#fff4d6 center/cover;display:grid;place-items:center;font-size:36px;position:relative;flex:none}
.pthumb .badge{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:#fff;font-size:17px;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.row input[type=text]{font-size:17px;padding:9px 10px;border-radius:12px;border:2px solid #eadfd2;width:130px;font-family:inherit}
.row input.emo{width:60px;text-align:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:15px}
.toggle input{width:24px;height:24px}
.msg{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#4a3a3a;color:#fff;padding:12px 20px;border-radius:14px;font-size:16px;z-index:50;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.msg.show{opacity:1}
.hidden-input{display:none}
@media (max-width:900px){.title-tag{display:none}.seg button{padding:10px 10px;font-size:16px;white-space:nowrap}}
.shape-row{display:flex;align-items:center;gap:10px;padding:4px clamp(14px,3vw,34px) 6px;flex-wrap:wrap}
.shape-row .lab{font-size:clamp(20px,3vmin,28px);margin-right:4px}
.shape-row button{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border-radius:20px;padding:8px 14px 6px;min-width:84px;box-shadow:0 5px 0 rgba(0,0,0,.08);font-size:18px;border:4px solid transparent}
.shape-row button svg{width:40px;height:40px}
.shape-row button.sel{border-color:var(--pink);background:#ffeef4}
.shape-row button:active{transform:translateY(3px)}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="cloud" style="top:8%;animation-delay:-4s">☁️</div>
  <div class="cloud" style="top:22%;animation-delay:-12s;animation-duration:24s">☁️</div>
  <div class="corner l"><button class="icon-btn" id="fsBtn1" aria-label="전체 화면">⛶</button></div>
  <div class="corner r"><button class="icon-btn" id="gearBtn" aria-label="엄마 아빠 설정">⚙️<span class="hold-fill" id="holdFill"></span></button></div>
  <div class="hold-tip" id="holdTip">꾹 누르고 있으면 설정이 열려요</div>
  <h1>서연아, 놀러 가자!</h1>
  <div class="portrait" id="homePortrait"></div>
  <button class="big-btn" id="startBtn">출발! 🚗</button>
</section>

<!-- CHOOSE -->
<section id="choose" class="screen">
  <div class="corner l"><button class="icon-btn" id="toHome" aria-label="처음으로">🏠</button></div>
  <div class="corner r"><button class="icon-btn" id="musBtn2" aria-label="음악">🎵</button></div>
  <div class="choose-head">
    <div class="mini-face" id="chooseFace"></div>
    <div class="bubble" id="askBubble">서연아! 어디 갈까? 🔊</div>
  </div>
  <div class="shape-row" id="shapeRow"><span class="lab">길 모양</span></div>
  <div class="grid" id="grid"></div>
</section>

<!-- PLAY -->
<section id="play" class="screen">
  <canvas id="cv"></canvas>
  <div class="topbar">
    <div class="grp">
      <button class="icon-btn" id="backBtn" aria-label="장소 고르기">🗺️</button>
      <button class="icon-btn" id="againBtn" aria-label="다시">↺</button>
      <div class="title-tag" id="playTitle"></div>
    </div>
    <div class="grp">
      <div class="seg" id="widthSeg">
        <button data-w="wide">넓은 길</button><button data-w="mid">보통 길</button><button data-w="narrow">좁은 길</button>
      </div>
      <button class="icon-btn" id="sndBtn" aria-label="소리">🔊</button>
      <button class="icon-btn" id="musBtn" aria-label="음악">🎵</button>
      <button class="icon-btn" id="fsBtn2" aria-label="전체 화면">⛶</button>
    </div>
  </div>
</section>

<div id="win">
  <div class="win-box">
    <div class="win-title" id="winTitle">도착!</div>
    <div class="win-pics"><div class="mini-face" id="winFace"></div><div style="font-size:50px">💖</div><div class="win-dest" id="winDest"></div></div>
    <div class="win-btns">
      <button id="winAgain">🔁 다시 하기</button>
      <button class="main" id="winOther">🗺️ 다른 곳 가기</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

<!-- SETTINGS -->
<section id="settings">
  <div class="set-wrap">
    <div class="set-head"><h2>⚙️ 엄마·아빠 설정</h2><button class="done-btn" id="setDone">다 했어요</button></div>

    <div class="sec">
      <h3>🎙️ 목소리 녹음</h3>
      <p class="help" id="micHelp">⏺ 를 누르고 말한 뒤 ⏹ 를 누르세요. 녹음하지 않은 문장은 기본 목소리가 읽어 줘요.<br>녹음은 이 태블릿의 이 브라우저에만 저장돼요.</p>
      <div id="voiceRows"></div>
    </div>

    <div class="sec">
      <h3>📍 장소</h3>
      <p class="help">사진을 넣으면 사진과 아이콘이 함께 나와요. 이름·아이콘(이모지)을 바꾸거나, 안 쓰는 장소는 숨길 수 있어요.</p>
      <div id="placeRows"></div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
        <button class="sbtn add" id="addPlace">＋ 장소 추가</button>
        <button class="sbtn" id="resetPlaces">기본 장소로 되돌리기</button>
      </div>
    </div>

    <div class="sec">
      <h3>👧 서연이 사진</h3>
      <p class="help">얼굴이 가운데 오게 정사각형으로 잘려요.</p>
      <div class="row">
        <div class="pthumb" id="facePrev" style="border-radius:50%"></div>
        <div class="lbl">길을 따라가는 서연이 사진</div>
        <button class="sbtn" id="faceChange">📷 바꾸기</button>
        <button class="sbtn" id="faceReset">기본 사진</button>
      </div>
    </div>
  </div>
</section>

<input type="file" accept="image/*" class="hidden-input" id="imgInput">
<input type="file" accept="audio/*,video/mp4,.m4a,.mp3,.wav,.aac" class="hidden-input" id="audInput">
<div class="msg" id="msg"></div>

let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==="suspended")actx.resume();return actx}
function tone(f,dur=.12,type="sine",vol=.18,when=0){
  if(!opt.sound)return;const a=ac();if(!a)return;
  const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
const sfx={
  pop(i){tone(660+ (i%6)*90,.12,"triangle",.16)},
  grab(){tone(520,.08,"sine",.15);tone(780,.1,"sine",.12,.06)},
  off(){tone(300,.15,"sine",.12);tone(240,.18,"sine",.1,.1)},
  tap(){tone(880,.07,"triangle",.12)},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.18,i*.12))}
};
let musicTimer=null,mGain=null,mStep=0,mNext=0;
const midi=m=>440*Math.pow(2,(m-69)/12);
const MEL=[[64,67,69,67,64,60,62,64],[65,69,67,65,64,62,60,0],[62,64,65,62,67,65,64,62],[60,64,67,64,60,0,0,0],
           [69,72,71,69,67,64,67,0],[65,67,69,65,64,62,60,0],[62,62,65,67,71,69,67,65],[64,62,60,62,60,0,0,0]];
const BASS=[48,53,55,48,57,53,55,48];
const CHORD=[[60,64,67],[60,65,69],[59,62,67],[60,64,67],[60,64,69],[60,65,69],[59,62,67],[60,64,67]];
const EIGHTH=60/116/2;
function mNote(a,f,t,dur,type,vol){const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g).connect(mGain);o.start(t);o.stop(t+dur+.03)}
let noiseBuf=null;
function mHat(a,t,vol){if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.05,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();n.buffer=noiseBuf;f.type="highpass";f.frequency.value=7000;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+.04);n.connect(f).connect(g).connect(mGain);n.start(t);n.stop(t+.05)}
function scheduleMusic(){const a=actx;if(!a||!mGain)return;
  while(mNext<a.currentTime+.25){
    const bar=Math.floor(mStep/8)%8,e=mStep%8,t=mNext;
    const m=MEL[bar][e];if(m)mNote(a,midi(m),t,EIGHTH*1.6,"triangle",.32);
    if(e===0||e===4)mNote(a,midi(BASS[bar]+(e===4?7:0)),t,EIGHTH*1.8,"sine",.38);
    if(e===2||e===6)CHORD[bar].forEach(c=>mNote(a,midi(c),t,EIGHTH*.9,"square",.035));
    if(e%2===0)mHat(a,t,e%4===0?.06:.035);
    mStep++;mNext+=EIGHTH;
  }}
let ducked=false;
function duck(on){ducked=on;if(!mGain||!actx)return;const t=actx.currentTime;mGain.gain.cancelScheduledValues(t);mGain.gain.setTargetAtTime(on?.04:.16,t,.12)}
function music(on){
  clearInterval(musicTimer);musicTimer=null;
  if(!on){if(mGain&&actx){mGain.gain.setTargetAtTime(0,actx.currentTime,.08)}return}
  const a=ac();if(!a)return;
  if(!mGain){mGain=a.createGain();mGain.connect(a.destination)}
  mGain.gain.cancelScheduledValues(a.currentTime);mGain.gain.setValueAtTime(0,a.currentTime);mGain.gain.setTargetAtTime(ducked?.04:.16,a.currentTime,.3);
  mNext=a.currentTime+.08;mStep=0;scheduleMusic();musicTimer=setInterval(scheduleMusic,60);
}

function fileToSquare(file,size,center=true){

    const img=new Image();const u=URL.createObjectURL(file);
    img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");
      const s=Math.min(img.width,img.height);const sx=(img.width-s)/2;const sy=center?(img.height-s)/2:Math.max(0,(img.height-s)*.25);

    img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u;

const cv=$("#cv"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1;

function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}

function catmull(pts,step=4){
  const out=[];const P=[pts[0],...pts,pts[pts.length-1]];
  for(let i=1;i<P.length-2;i++){
    const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];
    const seg=Math.hypot(p2.x-p1.x,p2.y-p1.y);const n=Math.max(2,Math.ceil(seg/step));
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
      out.push({x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
                y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)})}

// even resample to fixed spacing
function resample(pts,sp=4){
  const out=[pts[0]];let acc=0;
  for(let i=1;i<pts.length;i++){let a=out[out.length-1],b=pts[i];let d=Math.hypot(b.x-a.x,b.y-a.y);
    while(d>=sp){const t=sp/d;a={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};out.push(a);d=Math.hypot(b.x-a.x,b.y-a.y)}}
  if(out.length<2||Math.hypot(out[out.length-1].x-pts[pts.length-1].x,out[out.length-1].y-pts[pts.length-1].y)>0.5)out.push(pts[pts.length-1]);

}

function polyClosed(vs){return vs.concat([vs[0]])}
function buildShape(shape,seed,rw){
  const r=rng(seed+11);const top=110,pad=Math.max(60,rw*.75)+20;
  const AW=W-2*pad, AH=H-top-2*pad, cxm=W/2, cym=top+pad+AH/2;
  const out={closed:false};
  if(shape==="line"){
    const kind=AW>=AH?(r()<.65?"h":"d"):(r()<.65?"v":"d");const back=r()<.5;
    let a,b;
    if(kind==="h"){const y=cym+(r()-.5)*AH*.3;a={x:pad+20,y};b={x:W-pad-20,y}}
    else if(kind==="v"){const x=cxm+(r()-.5)*AW*.3;a={x,y:top+pad+10};b={x,y:H-pad-10}}
    else{a={x:pad+30,y:H-pad-20};b={x:W-pad-30,y:top+pad+20}}
    if(back)[a,b]=[b,a];
    out.pts=resample([a,b],4);return out;
  }
  out.closed=true;
  if(shape==="circle"){
    const R=Math.min(AW,AH)/2;const n=180;const ccw=r()<.5;const pts=[];
    for(let i=0;i<=n;i++){const an=-Math.PI/2+(ccw?-1:1)*2*Math.PI*i/n;pts.push({x:cxm+Math.cos(an)*R,y:cym+Math.sin(an)*R})}
    out.pts=resample(pts,4);out.center={x:cxm,y:cym};out.free=R-rw/2-14;return out;
  }
  if(shape==="tri"){
    const h=Math.min(AH,AW*.87),bw=Math.min(AW,h*1.2);
    const A={x:cxm,y:cym-h/2},B={x:cxm+bw/2,y:cym+h/2},C={x:cxm-bw/2,y:cym+h/2};
    const vs=r()<.5?[A,B,C]:[A,C,B];
    const a=Math.hypot(B.x-C.x,B.y-C.y),b=Math.hypot(A.x-C.x,A.y-C.y),c=Math.hypot(A.x-B.x,A.y-B.y);
    const per=a+b+c;const inc={x:(a*A.x+b*B.x+c*C.x)/per,y:(a*A.y+b*B.y+c*C.y)/per};
    const area=Math.abs((B.x-A.x)*(C.y-A.y)-(C.x-A.x)*(B.y-A.y))/2;
    out.pts=resample(polyClosed(vs),4);out.center=inc;out.free=2*area/per-rw/2-14;return out;
  }
  // rect (square)
  const S=Math.min(AW,AH);const x0=cxm-S/2,y0=cym-S/2;
  let vs=[{x:x0,y:y0},{x:x0+S,y:y0},{x:x0+S,y:y0+S},{x:x0,y:y0+S}];
  if(r()<.5)vs=[vs[0],vs[3],vs[2],vs[1]];

}
function buildPath(seed,widthKey){
  const r=rng(seed);
  const top=110, pad=Math.max(70,WIDTHS[widthKey]*0.9);
  const landscape=W>=H;
  // work in (u: long axis, v: short axis)
  const U=landscape?W:H-top, V=landscape?H-top:W;
  const shapes=widthKey==="wide"?["wave","arch","wave"]:widthKey==="mid"?["wave","snake2","zig"]:["snake2","zig","snake3","wave"];
  const shape=shapes[Math.floor(r()*shapes.length)];
  const u0=pad+40,u1=U-pad-40,v0=pad*0.9,v1=V-pad*0.9;
  let pts=[];
  const flip=r()<.5;
  if(shape==="wave"||shape==="zig"){
    const n=widthKey==="wide"?3:widthKey==="mid"?4:5;
    pts.push({u:u0,v:v0+(v1-v0)*(flip?.2:.8)});
    for(let i=1;i<=n;i++){const u=u0+(u1-u0)*i/(n+1);const hi=(i%2===1)!==flip;
      const amp=shape==="zig"?.95:.7+r()*.25;pts.push({u,v:hi?v0+(v1-v0)*(1-amp):v0+(v1-v0)*amp})}
    pts.push({u:u1,v:v0+(v1-v0)*(flip?.8:.2)});
  }else if(shape==="arch"){
    pts=[{u:u0,v:v1-(v1-v0)*.1},{u:u0+(u1-u0)*.25,v:v0+(v1-v0)*.15},{u:u0+(u1-u0)*.55,v:v0+(v1-v0)*.55},{u:u0+(u1-u0)*.78,v:v0+(v1-v0)*.1},{u:u1,v:v1-(v1-v0)*.15}];
    if(flip)pts=pts.map(p=>({u:p.u,v:v0+v1-p.v}));
  }else{ // snake rows
    const rows=shape==="snake3"?3:2;
    for(let rI=0;rI<rows;rI++){const v=v0+(v1-v0)*(rI/(rows-1));const L=rI%2===0;
      const a=L?u0:u1,b=L?u1:u0;
      if(rI===0)pts.push({u:a,v});
      pts.push({u:a+(b-a)*.5,v:v+(r()-.5)*(v1-v0)*.08});
      pts.push({u:b,v});
    }
    if(flip)pts=pts.map(p=>({u:p.u,v:v0+v1-p.v}));
  }
  const xy=pts.map(p=>landscape?{x:p.u,y:top+p.v}:{x:p.v,y:top+p.u});
  return resample(catmull(xy,6),4);
}

function computeLen(path){const L=[0];for(let i=1;i<path.length;i++)L.push(L[i-1]+Math.hypot(path[i].x-path[i-1].x,path[i].y-path[i-1].y));return L}

function setupPath(keepProgress){
  const rw=WIDTHS[opt.width]*Math.min(1,Math.max(.7,Math.min(W,H)/700));
  let path;G.closed=false;G.center=null;
  if(G.shape==="wave"){path=buildPath(G.seed,opt.width)}
  else{const o=buildShape(G.shape,G.seed,rw);path=o.pts;G.closed=o.closed;G.center=o.center||null;G.free=o.free||0}
  const L=computeLen(path);
  const ratio=keepProgress&&G.L?G.idx/(G.path.length-1):0;
  G.path=path;G.L=L;G.total=L[L.length-1];G.rw=rw;
  G.R=Math.max(rw*.62,42);
  G.idx=Math.round(ratio*(path.length-1));G.done=false;
  // stars
  G.stars=[];const gap=Math.max(120,rw*1.6);
  for(let s=gap;s<G.total-gap*.6;s+=gap){let i=L.findIndex(v=>v>=s);G.stars.push({i,got:i<=G.idx,t:0})}
  // decorations
  const r=rng(G.seed*7+3);G.deco=[];
  const decos=["🌳","🌷","🌼","🌲","🍄","🦋","🌻","🐞","🌸","🐿️"];
  for(let k=0;k<60&&G.deco.length<14;k++){const x=r()*W,y=110+r()*(H-110);
    let ok=true;for(let i=0;i<path.length;i+=6){if(Math.hypot(path[i].x-x,path[i].y-y)<rw*1.1+40){ok=false;break}}
    if(G.center&&Math.hypot(G.center.x-x,G.center.y-y)<G.free+30)ok=false;
    if(ok)G.deco.push({x,y,e:decos[Math.floor(r()*decos.length)],s:28+r()*22})}
}

// pointer handling
function local(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
let penSeen=false;
function nearest(p,from,to){let best=-1,bd=1e9;from=Math.max(0,from);to=Math.min(G.path.length-1,to);
  for(let i=from;i<=to;i++){const q=G.path[i];const d=(q.x-p.x)**2+(q.y-p.y)**2;if(d<bd){bd=d;best=i}}return{i:best,d:Math.sqrt(bd)}}
cv.addEventListener("pointerdown",e=>{
  if(!G||G.done)return;
  if(e.pointerType==="pen")penSeen=true;
  if(penSeen&&e.pointerType==="touch")return; // palm rejection once a pen is used
  if(G.pid!==null)return;
  const p=local(e);const a=G.path[G.idx];
  const tol=G.rw*.5+G.R*.5;
  const near=Math.hypot(p.x-a.x,p.y-a.y)<Math.max(G.R*1.5,tol*1.3);
  if(near){G.drag=true;G.pid=e.pointerId;G.last=p;try{cv.setPointerCapture(e.pointerId)}catch(_){}sfx.grab();G.offT=0;stopVoice()}
  else{G.hintT=performance.now()}
});
cv.addEventListener("pointermove",e=>{
  if(!G||!G.drag||e.pointerId!==G.pid||G.done)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])) stepTo(local(ev));
});
function stepTo(p){
  // subdivide big jumps
  const last=G.last||p;const dist=Math.hypot(p.x-last.x,p.y-last.y);const n=Math.max(1,Math.ceil(dist/6));
  for(let k=1;k<=n;k++){
    const q={x:last.x+(p.x-last.x)*k/n,y:last.y+(p.y-last.y)*k/n};
    const ahead=Math.ceil((G.rw*1.6)/4);
    const r=nearest(q,G.idx-4,G.idx+ahead);
    const tol=G.rw*.5+18; // forgiving for little hands
    if(r.d<=tol){ if(r.i>G.idx){G.idx=r.i;G.moveT=performance.now();checkStars()} G.offT=0 }
    else if(r.d>tol*1.9){ G.drag=false;G.pid=null;G.offT=performance.now();sfx.off();
      if(!G.lastOffSay||performance.now()-G.lastOffSay>5000){G.lastOffSay=performance.now();say("off","어? 길로 다시 와 보자!")}
      return }
  }
  G.last=p;
  G.trail.push({x:p.x,y:p.y});if(G.trail.length>40)G.trail.shift();

cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);

function win(){
  if(G.done)return;G.done=true;G.drag=false;G.pid=null;G.idx=G.path.length-1;
  sfx.win();

    const p=G.place;$("#winTitle").textContent=`${p.name} 도착!`;
    placeVisual($("#winDest"),p);
    $("#win").classList.add("on");startConfetti();
    say("win","우와! 도착했다! 서연이 최고!");

}

function roundRect(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function strokePath(path,from,to,w,color,dash){
  if(to-from<1)return;cx.beginPath();cx.moveTo(path[from].x,path[from].y);
  for(let i=from+1;i<=to;i++)cx.lineTo(path[i].x,path[i].y);
  cx.lineWidth=w;cx.strokeStyle=color;cx.lineCap="round";cx.lineJoin="round";cx.setLineDash(dash||[]);cx.stroke();cx.setLineDash([]);
}
function drawKid(x,y,R,t){

  const skin="#ffe0c8",jean="#5b7fb8",jeanD="#46679b",top="#4b3f3b",shoe="#ff7aa8";

    cx.fillStyle=jean;cx.beginPath();cx.roundRect?cx.roundRect(-R*.15,0,R*.3,R*.5,R*.12):cx.rect(-R*.15,0,R*.3,R*.5);cx.fill();
    cx.fillStyle=shoe;cx.beginPath();cx.ellipse(s*R*.04,R*.53,R*.2,R*.11,0,0,7);cx.fill();
    cx.fillStyle="#fff";cx.beginPath();cx.ellipse(s*R*.04,R*.5,R*.12,R*.035,0,0,7);cx.fill();cx.restore()});

    cx.fillStyle=skin;cx.beginPath();cx.arc(s*R*.06,R*.5,R*.11,0,7);cx.fill();cx.restore()});

function frame(t){

  G.stars.forEach(s=>{const q=P[s.i];
    if(!s.got)drawStar(q.x,q.y,rw*.2+Math.sin(t/300+s.i)*2,1);
    else{const k=(t-s.t)/500;if(k<1)drawStar(q.x,q.y-k*40,rw*.2*(1+k),1-k)}});
  // dest
  if(G.closed)drawDest(G.center.x,G.center.y,G.R,t,Math.min(G.R*2.1,G.free*1.3));else{const e=P[last];drawDest(e.x,e.y,G.R,t)}
  // avatar
  const a=P[G.idx];let R=G.R;
  const idle=!G.drag&&!G.done;
  if(idle){R*=1+Math.sin(t/260)*.05;
    // ring hint
    const k=(t%1400)/1400;cx.beginPath();cx.arc(a.x,a.y,G.R+10+k*36,0,7);cx.lineWidth=6;cx.strokeStyle=`rgba(255,122,168,${1-k})`;cx.stroke();
  }
  // off-road wobble
  if(G.offT&&t-G.offT<500){const k=(t-G.offT)/500;cx.save();cx.translate(Math.sin(k*30)*6*(1-k),0);drawKid(a.x,a.y,R,t);cx.restore()}
  else drawKid(a.x,a.y,R,t);
  // hand hint when idle at start or after tapping elsewhere
  if(idle&&(G.idx===0||t-G.hintT<1500)){
    const bob=Math.sin(t/220)*10;cx.font=`${G.R*1.05}px system-ui,"Apple Color Emoji","Segoe UI Emoji"`;cx.fillText("👆",a.x+G.R*.95,a.y+G.R*.35+bob);
  }
  // direction arrow ahead while dragging
  if(G.drag){const j=Math.min(last,G.idx+Math.ceil(rw*1.1/4));const b=P[j];const k=(t%800)/800;
    cx.beginPath();cx.arc(b.x,b.y,rw*.16+k*6,0,7);cx.fillStyle=`rgba(255,255,255,${.9-k*.6})`;cx.fill()}
}
requestAnimationFrame(frame);

/* ---------- confetti ---------- */
const cf=$("#confetti"),cfx=cf.getContext("2d");let cfP=[],cfOn=false;
function startConfetti(){cf.width=innerWidth;cf.height=innerHeight;cfOn=true;cfP=[];
  const cols=["#ff7aa8","#ffd34d","#7fdcc0","#8ec5ff","#c59bff","#ff9f68"];
  for(let i=0;i<160;i++)cfP.push({x:Math.random()*cf.width,y:-Math.random()*cf.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:5+Math.random()*7,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3});
  (function loop(){if(!cfOn)return;cfx.clearRect(0,0,cf.width,cf.height);
    cfP.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;if(p.y>cf.height+20){p.y=-20;p.x=Math.random()*cf.width}
      cfx.save();cfx.translate(p.x,p.y);cfx.rotate(p.a);cfx.fillStyle=p.c;cfx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cfx.restore()});
    requestAnimationFrame(loop)})();
}
function stopConfetti(){cfOn=false;cfx.clearRect(0,0,cf.width,cf.height)}

/* ================= SETTINGS ================= */
let recState=null; // {key,rec,stream,btn,timer}
async function openSettings(){stopVoice();music(false);$("#settings").classList.add("on");await renderVoiceRows();renderPlaceRows()}
$("#setDone").onclick=()=>{stopRec();$("#settings").classList.remove("on");renderGrid();if(opt.music)music(true)};

function voiceList(){return VOICES.concat(places.filter(p=>p.on).map(p=>({key:"place:"+p.id,label:placeLine(p),help:`${p.emoji} ${p.name}를 골랐을 때`})))}
async function renderVoiceRows(){
  const box=$("#voiceRows");box.innerHTML="";
  for(const v of voiceList()){
    const has=!!(await idbGet("voice:"+v.key));
    const row=document.createElement("div");row.className="row";
    row.innerHTML=`<div class="lbl">“${v.label}”<small>${v.help}</small></div>
      <span class="state ${has?"ok":""}">${has?"✅ 내 목소리":"기본 목소리"}</span>
      <button class="sbtn rec" data-a="rec">⏺ 녹음</button>
      <button class="sbtn" data-a="play">▶</button>
      <button class="sbtn" data-a="file" title="파일로 넣기">📁</button>
      ${has?'<button class="sbtn" data-a="del" title="지우기">🗑</button>':""}`;
    row.querySelector('[data-a=rec]').onclick=e=>toggleRec(v.key,e.currentTarget);
    row.querySelector('[data-a=play]').onclick=()=>{const o=opt.sound;opt.sound=true;say(v.key,v.label);opt.sound=o};
    row.querySelector('[data-a=file]').onclick=async()=>{const f=await pickFile($("#audInput"));if(!f)return;await idbSet("voice:"+v.key,f);toast("저장했어요");renderVoiceRows()};
    const d=row.querySelector('[data-a=del]');if(d)d.onclick=async()=>{await idbDel("voice:"+v.key);renderVoiceRows()};
    box.append(row);
  }
}
async function toggleRec(key,btn){
  if(recState){const same=recState.key===key;stopRec();if(same)return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){
    $("#micHelp").innerHTML="이 화면에서는 마이크를 쓸 수 없어요. 📁 버튼으로 녹음 파일을 넣어 주세요.<br>(아이패드 <b>음성 메모</b> 앱으로 녹음 → 공유 → <b>파일에 저장</b> 후 📁에서 고르면 돼요.)<br>이 게임 파일을 내 GitHub 페이지에 올리면 ⏺ 녹음 버튼이 바로 작동해요.";
    toast("마이크를 쓸 수 없어요. 📁로 녹음 파일을 넣어 주세요",3600);return}
  const types=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/aac"];
  const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  let rec;try{rec=new MediaRecorder(stream,mt?{mimeType:mt}:undefined)}catch(e){stream.getTracks().forEach(t=>t.stop());toast("이 브라우저는 녹음을 지원하지 않아요. 📁로 파일을 넣어 주세요",3600);return}
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());if(!chunks.length)return;
    const blob=new Blob(chunks,{type:rec.mimeType||mt||"audio/mp4"});await idbSet("voice:"+key,blob);toast("녹음했어요! ▶로 들어 보세요");renderVoiceRows()};
  rec.start();btn.classList.add("live");btn.textContent="⏹ 멈춤";
  recState={key,rec,stream,btn,timer:setTimeout(stopRec,10000)};
}
function stopRec(){if(!recState)return;clearTimeout(recState.timer);try{recState.rec.state!=="inactive"&&recState.rec.stop()}catch(e){}recState=null}

function renderPlaceRows(){
  const box=$("#placeRows");box.innerHTML="";
  places.forEach((p,idx)=>{
    const row=document.createElement("div");row.className="row";
    const th=document.createElement("div");th.className="pthumb";placeVisual(th,p);
    const name=document.createElement("input");name.type="text";name.value=p.name;name.maxLength=8;
    name.onchange=()=>{p.name=name.value.trim()||p.name;savePlaces();renderVoiceRows()};
    const emo=document.createElement("input");emo.type="text";emo.className="emo";emo.value=p.emoji;
    emo.onchange=()=>{p.emoji=emo.value.trim()||p.emoji;savePlaces();placeVisual(th,p)};
    const photo=document.createElement("button");photo.className="sbtn";photo.textContent=photoCache[p.id]?"📷 바꾸기":"📷 사진";
    photo.onclick=async()=>{const f=await pickFile($("#imgInput"));if(!f)return;try{const d=await fileToSquare(f,480);photoCache[p.id]=d;await idbSet("photo:"+p.id,d);renderPlaceRows()}catch(e){toast("사진을 열 수 없어요")}};
    const tg=document.createElement("label");tg.className="toggle";tg.innerHTML=`<input type="checkbox" ${p.on?"checked":""}>보이기`;
    tg.querySelector("input").onchange=e=>{p.on=e.target.checked;savePlaces();renderVoiceRows()};
    row.append(th,name,emo,photo);
    if(photoCache[p.id]){const rm=document.createElement("button");rm.className="sbtn";rm.textContent="사진 빼기";
      rm.onclick=async()=>{delete photoCache[p.id];await idbDel("photo:"+p.id);renderPlaceRows()};row.append(rm)}
    row.append(tg);
    const up=document.createElement("button");up.className="sbtn";up.textContent="▲";up.title="위로";
    up.onclick=()=>{if(idx===0)return;[places[idx-1],places[idx]]=[places[idx],places[idx-1]];savePlaces();renderPlaceRows();renderVoiceRows()};
    const del=document.createElement("button");del.className="sbtn";del.textContent="🗑";del.title="삭제";
    del.onclick=async()=>{if(del.dataset.sure!=="1"){del.dataset.sure="1";del.textContent="정말?";setTimeout(()=>{del.dataset.sure="";del.textContent="🗑"},2500);return}
      places.splice(idx,1);savePlaces();delete photoCache[p.id];await idbDel("photo:"+p.id);await idbDel("voice:place:"+p.id);renderPlaceRows();renderVoiceRows()};
    row.append(up,del);
    box.append(row);
  });
}
$("#addPlace").onclick=()=>{places.push({id:"c"+Date.now(),name:"새 장소",emoji:"⭐",on:true});savePlaces();renderPlaceRows();renderVoiceRows();
  setTimeout(()=>{const ins=$("#placeRows").querySelectorAll('input[type=text]:not(.emo)');const l=ins[ins.length-1];l&&l.focus();l&&l.select()},50)};
$("#resetPlaces").onclick=e=>{const b=e.currentTarget;if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="한 번 더 누르면 되돌려요";setTimeout(()=>{b.dataset.sure="";b.textContent="기본 장소로 되돌리기"},3000);return}
  places=JSON.parse(JSON.stringify(DEFAULT_PLACES));savePlaces();renderPlaceRows();renderVoiceRows();b.dataset.sure="";b.textContent="기본 장소로 되돌리기"};
$("#faceChange").onclick=async()=>{const f=await pickFile($("#imgInput"));if(!f)return;try{
  faceURL=await fileToSquare(f,360,false);bigURL=await fileToSquare(f,480,false);await idbSet("face",faceURL);await idbSet("big",bigURL);paintFaces();toast("사진을 바꿨어요")}catch(e){toast("사진을 열 수 없어요")}};
$("#faceReset").onclick=async()=>{faceURL=DEFAULT_FACE;bigURL=DEFAULT_BIG;await idbDel("face");await idbDel("big");paintFaces()};

/* ================= init ================= */
(async()=>{
  try{speechSynthesis&&speechSynthesis.getVoices()}catch(e){}
  const f=await idbGet("face"),b=await idbGet("big");if(f)faceURL=f;if(b)bigURL=b;
  for(const p of places){const d=await idbGet("photo:"+p.id);if(d)photoCache[p.id]=d}
  paintFaces();paintSeg();paintToggles();
})();
paintFaces();paintSeg();paintToggles();
document.addEventListener("gesturestart",e=>e.preventDefault());
})();
</script>
